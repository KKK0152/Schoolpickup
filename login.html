<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>เข้าสู่ระบบ – ระบบรับส่งนักเรียน</title>
  <meta name="description" content="เข้าสู่ระบบบริหารจัดการการรับ–ส่งนักเรียน สำหรับผู้ปกครองและครู" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="page-login">

  <div class="login-container">
    <div class="login-logo">
      <div class="login-logo-icon">🏫</div>
      <div class="login-logo-title">SchoolPickup</div>
      <div class="login-logo-sub">ระบบบริหารจัดการการรับ–ส่งนักเรียน</div>
    </div>

    <div class="login-card">
      <div class="login-tabs">
        <button class="login-tab active" id="tab-parent" onclick="setRole('parent')">
          🎒 นักเรียน
        </button>
        <button class="login-tab" id="tab-teacher" onclick="setRole('teacher')">
          👩‍🏫 ครู / ผู้ดูแล
        </button>
      </div>

      <div id="login-form-section">
        <div class="login-form-title" id="login-title">เข้าสู่ระบบนักเรียน</div>
        <div class="login-form-sub" id="login-sub">กรุณาใช้รหัสนักเรียนที่ได้รับจากโรงเรียน</div>

        <form id="loginForm" onsubmit="handleLogin(event)">
          <div class="form-group">
            <label class="form-label" for="username">รหัสนักเรียน</label>
            <div class="form-input-wrap">
              <span class="form-input-icon">🎒</span>
              <input type="text" id="username" class="form-input" placeholder="กรอกรหัสนักเรียน" required autocomplete="username" />
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="password">รหัสผ่าน</label>
            <div class="form-input-wrap">
              <span class="form-input-icon">🔒</span>
              <input type="password" id="password" class="form-input" placeholder="กรอกรหัสผ่าน" required autocomplete="current-password" />
              <button type="button" id="toggle-password" onclick="togglePassword()" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:18px;">👁️</button>
            </div>
          </div>

          <div class="login-demo" id="demo-info">
            <strong>🔑 บัญชีสาธิต (นักเรียน):</strong><br/>
            รหัสนักเรียน: <strong>691231</strong> | รหัสผ่าน: <strong>1234</strong><br/>
            รหัสนักเรียน: <strong>691232</strong> | รหัสผ่าน: <strong>1234</strong>
          </div>

          <button type="submit" class="login-submit" id="login-btn">
            <span>เข้าสู่ระบบ</span>
            <span>→</span>
          </button>
        </form>
      </div>

      <div id="error-msg" style="display:none; background:rgba(239,68,68,0.08); border:1px solid rgba(239,68,68,0.2); color:#b91c1c; padding:12px 16px; border-radius:10px; font-size:13px; margin-top:16px; text-align:center;"></div>
    </div>

    <div class="login-back">
      <a href="index.html">← กลับหน้าหลัก</a>
    </div>
  </div>

  <script src="js/auth.js"></script>
</body>
</html>
